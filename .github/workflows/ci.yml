name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check backend syntax
        run: node --check backend/index.js

      - name: Check frontend script syntax
        run: node --check frontend/app.js

      - name: Validate frontend HTML structure
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('frontend/index.html','utf8'); if(!/src=\"app.js\"/.test(html)) throw new Error('Missing app.js'); if(!html.includes('<!DOCTYPE html>') && !html.toLowerCase().includes('<!doctype html>')) throw new Error('Missing doctype');"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check Soroban contract compiles
        working-directory: contract
        run: cargo check
